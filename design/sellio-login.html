<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellio · Login</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <style>

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #1a0a10;
      font-family: var(--font-family);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .caption {
      font-family: var(--font-family);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }
    .caption strong { color: #fff; font-weight: 500; }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      border-radius: 56px;
      padding: 12px;
      background: linear-gradient(160deg, #2a2a2c 0%, #1a1a1c 50%, #0e0e10 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 0 2px #000 inset,
        0 28px 60px -12px rgba(0,0,0,0.45),
        0 8px 20px -8px rgba(0,0,0,0.35);
      isolation: isolate;
    }
    .device::before, .device::after {
      content: '';
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.06) 8%, transparent 16%, transparent 84%, rgba(255,255,255,0.04) 92%, transparent 100%);
      top: 100px;
      bottom: 100px;
      pointer-events: none;
    }
    .device::before { left: -1px; }
    .device::after  { right: -1px; }

    .island {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 999px;
      z-index: 5;
    }

    .btn-rail {
      position: absolute;
      width: 4px;
      background: #0a0a0c;
      border-radius: 2px;
    }
    .btn-rail.left-1  { left: -3px; top: 174px; height: 32px; }
    .btn-rail.left-2  { left: -3px; top: 220px; height: 60px; }
    .btn-rail.left-3  { left: -3px; top: 290px; height: 60px; }
    .btn-rail.right-1 { right: -3px; top: 250px; height: 100px; }

    .screen {
      position: relative;
      width: 100%; height: 100%;
      background: var(--color-primary);
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      flex: 0 0 47px;
      padding: 18px 26px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-family: var(--font-family);
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
      position: relative;
      z-index: 3;
    }
    .statusbar .right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: #fff; }
    .statusbar .battery { width: 25px; }

    .top-section {
      position: relative;
      flex: 0 0 247px;
      background: var(--color-auth-background);
      overflow: hidden;
    }
    .top-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 30%, rgba(120, 10, 50, 0.6) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 30% 60%, rgba(80, 5, 30, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 70% 40%, rgba(100, 8, 40, 0.3) 0%, transparent 50%);
    }
    .top-section::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: -10%;
      right: -10%;
      height: 120px;
      background:
        radial-gradient(ellipse 50% 80% at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 50%),
        radial-gradient(ellipse 40% 60% at 50% 90%, rgba(255,255,255,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 60% 70% at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 50%);
      border-radius: 50%;
    }

    .close-btn {
      position: absolute;
      top: 40px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 4;
    }
    .close-btn svg {
      width: 28px;
      height: 28px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
    }

    .logo {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-family: var(--font-family);
      font-size: 28px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .white-card {
      position: absolute;
      top: 223px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--color-surface-low);
      border-radius: 24px 24px 0 0;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    .card-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .card-content::-webkit-scrollbar { display: none; }

    .header-section { margin-bottom: 40px; }
    .header-section h1 {
      font-family: var(--font-family);
      font-size: 20px;
      font-weight: 600;
      color: var(--color-title-text);
      margin: 0 0 8px;
      line-height: 1.5;
    }
    .header-section p {
      font-size: 16px;
      color: var(--color-body-text);
      margin: 0;
    }

    .form-group { margin-bottom: 16px; }

    .input-container {
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border: 0.5px solid var(--color-stroke-border);
      border-radius: var(--field-border-radius);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-container.focused {
      border-color: var(--color-primary);
      border-width: 1px;
      box-shadow: 0 4px 8px var(--shadow-field-focus);
    }
    .input-container.error {
      border-color: var(--color-semantic-error);
      border-width: 1px;
    }

    .input-icon {
      padding: 0 12px 0 16px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .input-icon svg {
      width: 24px;
      height: 24px;
      fill: var(--color-body-text);
    }
    .input-container.focused .input-icon svg { fill: var(--color-primary); }
    .input-container.error .input-icon svg { fill: var(--color-semantic-error); }

    .country-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .country-selector svg {
      width: 20px;
      height: 20px;
      fill: var(--color-title-text);
    }
    .country-flag {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .country-code {
      font-size: 16px;
      color: var(--color-title-text);
      white-space: nowrap;
    }

    .input-field {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-family);
      font-size: 16px;
      color: var(--color-title-text);
      padding: 14px 12px;
      outline: none;
      min-width: 0;
    }
    .input-field::placeholder { color: var(--color-body-text); font-size: 14px; }
    .input-field:focus::placeholder { color: var(--color-title-text); }

    .password-field { position: relative; }
    .password-field .input-field { padding-right: 48px; }
    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      background: none;
      border: none;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .eye-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--color-body-text);
    }

    .error-msg {
      font-size: 12px;
      color: var(--color-semantic-error);
      margin: 4px 0 0 4px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .phone-counter {
      font-size: 12px;
      color: var(--color-body-text);
      margin: 4px 0 0 4px;
      display: none;
      text-align: right;
    }
    .phone-counter.visible { display: block; }
    .phone-counter.error { color: var(--color-semantic-error); font-weight: 600; }

    .forget-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .forget-btn {
      background: none;
      border: none;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-primary);
      cursor: pointer;
      padding: 8px 0;
    }

    .card-footer {
      padding: 16px;
      flex-shrink: 0;
    }

    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 9px 24px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      border: none;
      border-radius: var(--button-border-radius);
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      gap: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-login:disabled {
      background: var(--color-disabled);
      color: var(--color-hint-text);
      cursor: not-allowed;
    }
    .btn-login .arrow {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    .loading-dots {
      display: none;
      gap: 7px;
      align-items: center;
    }
    .loading-dots.active { display: flex; }
    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-on-primary);
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(1) { animation-name: dot-pulse-1; }
    .loading-dots span:nth-child(2) { animation-name: dot-pulse-2; }
    .loading-dots span:nth-child(3) { animation-name: dot-pulse-3; }
    @keyframes dot-pulse-1 { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.87; } }
    @keyframes dot-pulse-2 { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.50; } }
    @keyframes dot-pulse-3 { 0%, 100% { opacity: 0.50; } 50% { opacity: 0.87; } }

    .divider-row {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 12px 0;
    }
    .divider-row .line {
      flex: 1;
      height: 1px;
      background: var(--color-stroke-border);
    }
    .divider-row .or-text {
      padding: 0 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-body-text);
    }

    .btn-create {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      padding: 9px 24px;
      background: var(--color-primary-variant);
      color: var(--color-primary);
      border: none;
      border-radius: var(--button-border-radius);
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .home-indicator {
      flex: 0 0 28px;
      position: relative;
    }
    .home-indicator::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 8px;
      transform: translateX(-50%);
      width: 134px; height: 5px;
      background: var(--color-title-text);
      border-radius: 999px;
      opacity: 0.85;
    }

    /* Country Picker Bottom Sheet */
    .sheet-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      border-radius: 44px;
    }
    .sheet-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .country-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--color-surface-low);
      border-radius: var(--sheet-border-radius-top) var(--sheet-border-radius-top) 0 0;
      z-index: 11;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
      max-height: 80%;
      display: flex;
      flex-direction: column;
    }
    .sheet-overlay.open .country-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--color-stroke-border);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }

    .sheet-header {
      padding: 16px 16px 12px;
      flex-shrink: 0;
    }
    .sheet-header h3 {
      font-family: var(--font-family);
      font-size: 20px;
      font-weight: 600;
      color: var(--color-title-text);
      margin: 0 0 12px;
    }
    .search-container {
      display: flex;
      align-items: center;
      background: var(--color-surface);
      border: 0.5px solid var(--color-stroke-border);
      border-radius: var(--field-border-radius);
      padding: 0 12px;
    }
    .search-container svg {
      width: 16px;
      height: 16px;
      fill: var(--color-body-text);
      flex-shrink: 0;
    }
    .search-container input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: var(--font-family);
      font-size: 16px;
      color: var(--color-title-text);
      padding: 12px 8px;
      outline: none;
      min-width: 0;
    }
    .search-container input::placeholder { color: var(--color-body-text); }

    .sheet-favorites {
      padding: 8px 16px 4px;
      flex-shrink: 0;
    }
    .sheet-favorites .fav-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-body-text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .country-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .country-list::-webkit-scrollbar { display: none; }

    .country-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--color-stroke-border);
      cursor: pointer;
    }
    .country-item:last-child { border-bottom: none; }
    .country-item:active { background: var(--color-surface); border-radius: 8px; }

    .country-item .flag {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .country-item .name {
      flex: 1;
      font-size: 16px;
      color: var(--color-title-text);
      font-weight: 400;
    }
    .country-item .code {
      font-size: 16px;
      color: var(--color-body-text);
      font-weight: 500;
      white-space: nowrap;
    }

    /* Toast / Snackbar */
    .toast {
      position: absolute;
      top: 60px;
      left: 16px;
      right: 16px;
      padding: 14px 16px;
      border-radius: var(--field-border-radius);
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      z-index: 20;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .toast.success { background: var(--color-green); }
    .toast.error { background: var(--color-semantic-error); }
    .toast svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }

    /* Success overlay */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.95);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      border-radius: 44px;
    }
    .success-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .success-check {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--color-green);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop-in 0.4s cubic-bezier(0.2, 0, 0, 1);
    }
    .success-check svg { width: 40px; height: 40px; fill: #fff; }
    .success-overlay p {
      font-family: var(--font-family);
      font-size: 20px;
      font-weight: 600;
      color: var(--color-title-text);
      margin: 0;
    }
    .success-overlay .sub {
      font-size: 16px;
      color: var(--color-body-text);
      font-weight: 400;
    }
    @keyframes pop-in {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Sellio</strong> · Login</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1"  aria-hidden></span>
      <span class="btn-rail left-2"  aria-hidden></span>
      <span class="btn-rail left-3"  aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island"           aria-hidden></span>

      <div class="screen">
        <div class="statusbar">
          <span style="font-variant-numeric: tabular-nums;">9:41</span>
          <span class="right">
            <svg viewBox="0 0 17 11" aria-hidden>
              <rect x="0"  y="7" width="3" height="4" rx="0.6"/>
              <rect x="4"  y="5" width="3" height="6" rx="0.6"/>
              <rect x="8"  y="3" width="3" height="8" rx="0.6"/>
              <rect x="12" y="0" width="3" height="11" rx="0.6"/>
            </svg>
            <svg viewBox="0 0 17 11" aria-hidden>
              <path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1zM3.5 7.6L5 9.1c1-0.9 2.2-1.4 3.5-1.4 1.3 0 2.5 0.5 3.5 1.4l1.5-1.5c-1.4-1.3-3.1-2-5-2-1.9 0-3.6 0.7-5 2zM6.5 10.6l2 2 2-2c-0.5-0.5-1.2-0.8-2-0.8s-1.5 0.3-2 0.8z"/>
            </svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden>
              <rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
              <rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/>
              <rect x="2" y="2" width="18" height="7" rx="1.4"/>
            </svg>
          </span>
        </div>

        <div class="top-section">
          <button class="close-btn" aria-label="Close" data-od-id="close-btn">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <div class="logo" data-od-id="logo">SELLIO</div>
        </div>

        <div class="white-card" data-od-id="white-card">
          <div class="card-content" data-od-id="card-content">
            <div class="header-section" data-od-id="header">
              <h1>Welcome Back!</h1>
              <p>Enter your information to login</p>
            </div>

            <div class="form-group" data-od-id="phone-field">
              <div class="input-container" id="phone-container">
                <div class="input-icon">
                  <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.24 1.01l-2.2 2.2z"/></svg>
                </div>
                <div class="country-selector" id="country-selector">
                  <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg>
                  <div class="country-flag" id="country-flag-display">🇪🇬</div>
                  <span class="country-code" id="country-code-display">+20</span>
                </div>
                <input type="tel" class="input-field" placeholder="Phone number" id="phone-input" maxlength="10" data-od-id="phone-input" />
              </div>
              <div class="error-msg" id="phone-error">Phone number is required</div>
              <div class="phone-counter" id="phone-counter">0/10</div>
            </div>

            <div class="form-group" data-od-id="password-field">
              <div class="input-container password-field" id="password-container">
                <div class="input-icon">
                  <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
                </div>
                <input type="password" class="input-field" placeholder="Password" id="password-input" data-od-id="password-input" />
                <button class="eye-btn" id="eye-toggle" aria-label="Toggle password visibility" data-od-id="eye-toggle">
                  <svg viewBox="0 0 24 24" id="eye-open"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                  <svg viewBox="0 0 24 24" id="eye-closed" style="display:none;"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
                </button>
              </div>
              <div class="error-msg" id="password-error">Password must be at least 6 characters</div>
            </div>

            <div class="forget-row" data-od-id="forget-row">
              <button class="forget-btn" data-od-id="forget-btn">Forget your Password?</button>
            </div>
          </div>

          <div class="card-footer" data-od-id="footer">
            <button class="btn-login" id="login-btn" disabled data-od-id="login-btn">
              <span class="btn-text">Login</span>
              <span class="loading-dots" id="loading-dots">
                <span></span><span></span><span></span>
              </span>
              <svg class="arrow" viewBox="0 0 10 10" id="login-arrow"><path d="M1 5h7M5 1l4 4-4 4"/></svg>
            </button>

            <div class="divider-row">
              <div class="line"></div>
              <span class="or-text">OR</span>
              <div class="line"></div>
            </div>

            <button class="btn-create" data-od-id="create-btn">Create account</button>
          </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast">
          <svg viewBox="0 0 24 24" id="toast-icon"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <span id="toast-text"></span>
        </div>

        <!-- Success overlay -->
        <div class="success-overlay" id="success-overlay">
          <div class="success-check">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>
          <p>Login Successful</p>
          <span class="sub">Redirecting to home...</span>
        </div>

        <!-- Country Picker Bottom Sheet -->
        <div class="sheet-overlay" id="sheet-overlay">
          <div class="country-sheet" id="country-sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
              <h3>Select Country</h3>
              <div class="search-container">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" placeholder="Search by name or code" id="country-search" />
              </div>
            </div>
            <div class="sheet-favorites">
              <div class="fav-label">Favorite Countries</div>
            </div>
            <div class="country-list" id="country-list"></div>
          </div>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script>
    const COUNTRIES = [
      { code: 'IQ', name: 'Iraq', flag: '🇮🇶', dial: '+964', maxLength: 10 },
      { code: 'EG', name: 'Egypt', flag: '🇪🇬', dial: '+20', maxLength: 10 },
      { code: 'PS', name: 'Palestine', flag: '🇵🇸', dial: '+970', maxLength: 9 },
      { code: 'SY', name: 'Syria', flag: '🇸🇾', dial: '+963', maxLength: 10 },
      { code: 'SA', name: 'Saudi Arabia', flag: '🇸🇦', dial: '+966', maxLength: 9 },
      { code: 'AE', name: 'United Arab Emirates', flag: '🇦🇪', dial: '+971', maxLength: 9 },
      { code: 'JO', name: 'Jordan', flag: '🇯🇴', dial: '+962', maxLength: 9 },
      { code: 'LB', name: 'Lebanon', flag: '🇱🇧', dial: '+961', maxLength: 8 },
      { code: 'KW', name: 'Kuwait', flag: '🇰🇼', dial: '+965', maxLength: 8 },
      { code: 'QA', name: 'Qatar', flag: '🇶🇦', dial: '+974', maxLength: 8 },
      { code: 'BH', name: 'Bahrain', flag: '🇧🇭', dial: '+973', maxLength: 8 },
      { code: 'OM', name: 'Oman', flag: '🇴🇲', dial: '+968', maxLength: 8 },
      { code: 'YE', name: 'Yemen', flag: '🇾🇪', dial: '+967', maxLength: 9 },
      { code: 'LY', name: 'Libya', flag: '🇱🇾', dial: '+218', maxLength: 9 },
      { code: 'MA', name: 'Morocco', flag: '🇲🇦', dial: '+212', maxLength: 9 },
      { code: 'TN', name: 'Tunisia', flag: '🇹🇳', dial: '+216', maxLength: 8 },
      { code: 'DZ', name: 'Algeria', flag: '🇩🇿', dial: '+213', maxLength: 9 },
      { code: 'SD', name: 'Sudan', flag: '🇸🇩', dial: '+249', maxLength: 9 },
      { code: 'TR', name: 'Turkey', flag: '🇹🇷', dial: '+90', maxLength: 10 },
      { code: 'IR', name: 'Iran', flag: '🇮🇷', dial: '+98', maxLength: 10 },
    ];

    const FAVORITE_CODES = ['IQ', 'EG', 'PS', 'SY'];

    let selectedCountry = COUNTRIES.find(c => c.code === 'EG');
    let phoneValid = false;
    let passwordValid = false;

    const phoneInput = document.getElementById('phone-input');
    const passwordInput = document.getElementById('password-input');
    const phoneContainer = document.getElementById('phone-container');
    const passwordContainer = document.getElementById('password-container');
    const loginBtn = document.getElementById('login-btn');
    const loadingDots = document.getElementById('loading-dots');
    const loginArrow = document.getElementById('login-arrow');
    const btnText = loginBtn.querySelector('.btn-text');
    const eyeToggle = document.getElementById('eye-toggle');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');
    const phoneError = document.getElementById('phone-error');
    const passwordError = document.getElementById('password-error');
    const phoneCounter = document.getElementById('phone-counter');
    const countryFlagDisplay = document.getElementById('country-flag-display');
    const countryCodeDisplay = document.getElementById('country-code-display');
    const countrySelector = document.getElementById('country-selector');
    const sheetOverlay = document.getElementById('sheet-overlay');
    const countrySheet = document.getElementById('country-sheet');
    const countryList = document.getElementById('country-list');
    const countrySearch = document.getElementById('country-search');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const toastIcon = document.getElementById('toast-icon');
    const successOverlay = document.getElementById('success-overlay');

    function updateLoginBtn() {
      const phone = phoneInput.value.trim();
      const pass = passwordInput.value;
      phoneValid = phone.length > 0 && phone.length === selectedCountry.maxLength && /^[0-9]+$/.test(phone);
      passwordValid = pass.length >= 6;
      loginBtn.disabled = !(phoneValid && passwordValid);
    }

    function updatePhoneCounter() {
      const len = phoneInput.value.length;
      const max = selectedCountry.maxLength;
      if (len > 0) {
        phoneCounter.classList.add('visible');
        phoneCounter.textContent = `${len}/${max}`;
        phoneCounter.classList.toggle('error', len > max);
      } else {
        phoneCounter.classList.remove('visible');
      }
    }

    function renderCountryList(filter = '') {
      const favs = COUNTRIES.filter(c => FAVORITE_CODES.includes(c.code));
      const rest = COUNTRIES.filter(c => !FAVORITE_CODES.includes(c.code));
      const filteredFavs = filter ? favs.filter(c => c.name.toLowerCase().includes(filter) || c.dial.includes(filter) || c.code.toLowerCase().includes(filter)) : favs;
      const filteredRest = filter ? rest.filter(c => c.name.toLowerCase().includes(filter) || c.dial.includes(filter) || c.code.toLowerCase().includes(filter)) : rest;

      let html = '';
      const renderItems = (items) => {
        items.forEach(c => {
          html += `<div class="country-item" data-code="${c.code}">
            <div class="flag">${c.flag}</div>
            <span class="name">${c.name}</span>
            <span class="code">${c.dial}</span>
          </div>`;
        });
      };

      if (filteredFavs.length > 0) {
        renderItems(filteredFavs);
      }
      if (filteredRest.length > 0) {
        renderItems(filteredRest);
      }

      countryList.innerHTML = html;

      countryList.querySelectorAll('.country-item').forEach(item => {
        item.addEventListener('click', () => {
          const code = item.dataset.code;
          selectedCountry = COUNTRIES.find(c => c.code === code);
          countryFlagDisplay.textContent = selectedCountry.flag;
          countryCodeDisplay.textContent = selectedCountry.dial;
          phoneInput.maxLength = selectedCountry.maxLength;
          phoneInput.value = '';
          updatePhoneCounter();
          updateLoginBtn();
          closeSheet();
        });
      });
    }

    function openSheet() {
      sheetOverlay.classList.add('open');
      countrySearch.value = '';
      renderCountryList();
      setTimeout(() => countrySearch.focus(), 350);
    }

    function closeSheet() {
      sheetOverlay.classList.remove('open');
    }

    countrySelector.addEventListener('click', openSheet);

    sheetOverlay.addEventListener('click', (e) => {
      if (e.target === sheetOverlay) closeSheet();
    });

    countrySearch.addEventListener('input', (e) => {
      renderCountryList(e.target.value.toLowerCase());
    });

    phoneInput.addEventListener('focus', () => {
      phoneContainer.classList.add('focused');
      phoneContainer.classList.remove('error');
      phoneError.classList.remove('visible');
    });
    phoneInput.addEventListener('blur', () => {
      phoneContainer.classList.remove('focused');
      const phone = phoneInput.value.trim();
      if (phone.length > 0 && phone.length < selectedCountry.maxLength) {
        phoneError.textContent = `Phone number must be ${selectedCountry.maxLength} digits`;
        phoneError.classList.add('visible');
        phoneContainer.classList.add('error');
      } else if (phone.length === 0) {
        phoneError.textContent = 'Phone number is required';
        phoneError.classList.add('visible');
        phoneContainer.classList.add('error');
      }
    });
    phoneInput.addEventListener('input', () => {
      phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
      updatePhoneCounter();
      updateLoginBtn();
      if (phoneInput.value.length === selectedCountry.maxLength) {
        phoneError.classList.remove('visible');
        phoneContainer.classList.remove('error');
      }
    });

    passwordInput.addEventListener('focus', () => {
      passwordContainer.classList.add('focused');
      passwordContainer.classList.remove('error');
      passwordError.classList.remove('visible');
    });
    passwordInput.addEventListener('blur', () => {
      passwordContainer.classList.remove('focused');
      if (passwordInput.value.length > 0 && passwordInput.value.length < 6) {
        passwordError.textContent = 'Password must be at least 6 characters';
        passwordError.classList.add('visible');
        passwordContainer.classList.add('error');
      } else if (passwordInput.value.length === 0) {
        passwordError.textContent = 'Password is required';
        passwordError.classList.add('visible');
        passwordContainer.classList.add('error');
      }
    });
    passwordInput.addEventListener('input', () => {
      updateLoginBtn();
      if (passwordInput.value.length >= 6) {
        passwordError.classList.remove('visible');
        passwordContainer.classList.remove('error');
      }
    });

    eyeToggle.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOpen.style.display = isPassword ? 'none' : 'block';
      eyeClosed.style.display = isPassword ? 'block' : 'none';
    });

    function showToast(type, message) {
      toast.className = 'toast ' + type;
      toastText.textContent = message;
      toastIcon.innerHTML = type === 'success'
        ? '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>'
        : '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';
      requestAnimationFrame(() => toast.classList.add('show'));
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showSuccess() {
      successOverlay.classList.add('show');
      sessionStorage.setItem('isLoggedIn', 'true');
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1500);
    }

    const MOCK_CREDENTIALS = {
      phone: '1012345678',
      password: 'password123'
    };

    loginBtn.addEventListener('click', () => {
      if (loginBtn.disabled) return;
      btnText.style.display = 'none';
      loginArrow.style.display = 'none';
      loadingDots.classList.add('active');
      loginBtn.disabled = true;

      setTimeout(() => {
        loadingDots.classList.remove('active');
        btnText.style.display = '';
        loginArrow.style.display = '';

        const phone = phoneInput.value.trim();
        const pass = passwordInput.value;

        if (phone === MOCK_CREDENTIALS.phone && pass === MOCK_CREDENTIALS.password) {
          showSuccess();
        } else {
          showToast('error', 'Invalid phone number or password');
          passwordInput.value = '';
          passwordContainer.classList.add('error');
          passwordError.textContent = 'Invalid credentials';
          passwordError.classList.add('visible');
        }
        updateLoginBtn();
      }, 2000);
    });

    // Close button → enter as guest
    document.querySelector('.close-btn').addEventListener('click', () => {
      sessionStorage.setItem('isLoggedIn', 'true');
      window.location.href = 'home.html';
    });

    document.querySelector('.forget-btn').addEventListener('click', () => {
      window.location.href = 'forgot-password.html';
    });
    document.querySelector('.btn-create').addEventListener('click', () => {
      window.location.href = 'create-account.html';
    });

    renderCountryList();
  </script>
</body>
</html>

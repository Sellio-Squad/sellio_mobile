<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellio · Notifications</title>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <link rel="stylesheet" href="../../assets/components.css">
  <link rel="stylesheet" href="../../assets/shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Sellio</strong> · Notifications</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen" style="background: var(--color-surface-low);">
        <div id="statusbar-main"></div>

        <!-- App bar -->
        <div class="sellio-appbar">
          <div class="sellio-appbar__back" id="back-btn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="sellio-appbar__title">Notifications</span>
        </div>

        <!-- Loading state -->
        <div class="notif-loading" id="notif-loading">
          <div class="notif-loading__spinner"></div>
        </div>

        <!-- Empty state -->
        <div class="notif-empty" id="notif-empty" style="display:none;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.75C8.2347 2.75 5.22513 5.69657 5.22513 9.27941V9.27948C5.22503 10.3321 5.17158 11.5212 4.40017 12.6239L4.3977 12.6274L4.39769 12.6274C4.29473 12.7728 4.18354 12.9203 4.07925 13.0586C4.05418 13.0918 4.02951 13.1245 4.00545 13.1565C3.87688 13.3277 3.75907 13.4879 3.6539 13.6478C3.44111 13.9714 3.31214 14.2476 3.27083 14.5105C3.13777 15.3571 3.69102 16.0479 4.71184 16.4584C8.99506 18.1805 15.0049 18.1805 19.2882 16.4584C20.309 16.0479 20.8622 15.3571 20.7292 14.5105C20.6879 14.2476 20.5589 13.9714 20.3461 13.6478C20.2409 13.4879 20.1231 13.3277 19.9946 13.1565C19.9705 13.1245 19.9458 13.0918 19.9208 13.0586C19.8165 12.9203 19.7053 12.7728 19.6023 12.6274L19.5998 12.6239C18.8284 11.5212 18.775 10.3321 18.7749 9.27948V9.27941C18.7749 5.69657 15.7653 2.75 12 2.75ZM3.72513 9.27935C3.72516 4.8216 7.45358 1.25 12 1.25C16.5464 1.25 20.2749 4.82164 20.2749 9.27941C20.275 10.3066 20.346 11.0727 20.8278 11.7624C20.9161 11.887 21.0096 12.011 21.1119 12.1468C21.1386 12.1822 21.1659 12.2184 21.1938 12.2556C21.3252 12.4304 21.4669 12.6221 21.5994 12.8237C21.8621 13.2232 22.1216 13.709 22.211 14.2776C22.5032 16.137 21.155 17.3245 19.8477 17.8501C15.2054 19.7166 8.79456 19.7166 4.15227 17.8501C2.84498 17.3245 1.49677 16.137 1.78902 14.2776C1.87839 13.709 2.13788 13.2232 2.40057 12.8237C2.53314 12.6221 2.67482 12.4304 2.80616 12.2556C2.83411 12.2184 2.8614 12.1822 2.88808 12.1468C2.99046 12.011 3.08395 11.887 3.17225 11.7624C3.65398 11.0726 3.72503 10.3066 3.72513 9.27941" fill="currentColor" fill-opacity="0.5"/><path opacity="0.4" fill-rule="evenodd" clip-rule="evenodd" d="M8.40894 20.5383C8.66392 20.2119 9.13525 20.1539 9.46168 20.4089C10.1229 20.9254 11.0109 21.25 12 21.25C12.9891 21.25 13.8771 20.9254 14.5383 20.4089C14.8648 20.1539 15.3361 20.2119 15.5911 20.5383C15.846 20.8647 15.7881 21.3361 15.4617 21.591C14.5306 22.3183 13.3159 22.75 12 22.75C10.6841 22.75 9.46935 22.3183 8.53832 21.591C8.21189 21.3361 8.15396 20.8647 8.40894 20.5383Z" fill="currentColor" fill-opacity="0.5"/></svg>
          <div class="notif-empty__title">No notifications yet</div>
          <div class="notif-empty__desc">Notifications will appear here</div>
        </div>

        <!-- Error state -->
        <div class="notif-error" id="notif-error" style="display:none;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#E54F40" opacity="0"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="#E54F40"/></svg>
          <div class="notif-error__title">Something went wrong</div>
          <div class="notif-error__desc">Unable to load notifications</div>
          <button class="sellio-button sellio-button--primary notif-error__retry" id="notif-retry-btn">Try Again</button>
        </div>

        <!-- Content -->
        <div class="notif-content" id="notif-content" style="display:none;"></div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>

  <script src="../../assets/shared-icons.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../data/mock-data.js"></script>
  <script src="script.js"></script>
</body>
</html>

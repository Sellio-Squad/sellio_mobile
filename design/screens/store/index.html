<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellio · Store</title>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <link rel="stylesheet" href="../../assets/components.css">
  <link rel="stylesheet" href="../../assets/shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Sellio</strong> · Store</div>

    <div class="device" data-od-id="device">
      <span class="btn-rail left-1" aria-hidden></span>
      <span class="btn-rail left-2" aria-hidden></span>
      <span class="btn-rail left-3" aria-hidden></span>
      <span class="btn-rail right-1" aria-hidden></span>
      <span class="island" aria-hidden></span>

      <div class="screen">
        <div id="statusbar-main"></div>

        <!-- Loading Shimmer -->
        <div class="store-loading" id="store-loading">
          <div class="shimmer-cover"></div>
          <div class="shimmer-profile"></div>
          <div class="shimmer-lines">
            <div class="shimmer-line shimmer-line--long"></div>
            <div class="shimmer-line shimmer-line--short"></div>
            <div class="shimmer-line shimmer-line--full"></div>
            <div class="shimmer-line shimmer-line--full"></div>
          </div>
          <div class="shimmer-featured-title">
            <div class="shimmer-line shimmer-line--medium"></div>
          </div>
          <div class="shimmer-featured-cards">
            <div class="shimmer-featured-card"></div>
            <div class="shimmer-featured-card"></div>
          </div>
          <div class="shimmer-tabs">
            <div class="shimmer-tab"></div>
            <div class="shimmer-tab"></div>
            <div class="shimmer-tab"></div>
          </div>
          <div class="shimmer-products">
            <div class="shimmer-product-card"></div>
            <div class="shimmer-product-card"></div>
            <div class="shimmer-product-card"></div>
          </div>
        </div>

        <!-- Main Content -->
        <div class="store-content" id="store-content">
          <!-- App Bar -->
          <div class="store-appbar" id="store-appbar">
            <div class="sellio-appbar__back" id="store-back">
              <svg viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="sellio-appbar__title" id="store-title"></div>
            <div class="store-appbar__actions">
              <button class="store-action-btn" id="store-fav-btn"></button>
              <button class="store-action-btn" id="store-info-btn">
                <svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.75C6.89137 2.75 2.75 6.89137 2.75 12C2.75 17.1086 6.89137 21.25 12 21.25C17.1086 21.25 21.25 17.1086 21.25 12C21.25 6.89137 17.1086 2.75 12 2.75ZM1.25 12C1.25 6.06294 6.06294 1.25 12 1.25C17.9371 1.25 22.75 6.06294 22.75 12C22.75 17.9371 17.9371 22.75 12 22.75C6.06294 22.75 1.25 17.9371 1.25 12Z" fill="#1F1F1F"/><path fill-rule="evenodd" clip-rule="evenodd" d="M12 7.25C12.4142 7.25 12.75 7.58579 12.75 8V8.01C12.75 8.42421 12.4142 8.75 12 8.75C11.5858 8.75 11.25 8.41421 11.25 8V8C11.25 7.58579 11.5858 7.25 12 7.25ZM12 11C12.4142 11 12.75 11.3358 12.75 11.75V17C12.75 17.4142 12.4142 17.75 12 17.75C11.5858 17.75 11.25 17.4142 11.25 17V11.75C11.25 11.3358 11.5858 11 12 11Z" fill="#1F1F1F"/></svg>
              </button>
            </div>
          </div>

          <!-- Store Scroll Container -->
          <div class="store-scroll" id="store-scroll">
            <!-- Store Header -->
            <div class="store-header">
              <div class="store-cover-wrap">
                <div class="store-cover" id="store-cover"></div>
                <div class="store-profile-circle" id="store-profile-wrap">
                  <div class="store-profile" id="store-profile"></div>
                </div>
                <div class="store-discount-tag" id="store-discount-tag" style="display:none;">
                  <span class="store-discount-frame"></span>
                  <span class="store-discount-content">
                    <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><path d="M2 10L6 2L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 10L18 2L22 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span id="store-discount-text"></span>
                  </span>
                </div>
              </div>
              <div class="store-info">
                <h2 class="store-name" id="store-name"></h2>
                <div class="store-meta">
                  <span class="store-location" id="store-location">
                    <svg viewBox="0 0 14 14" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 0C4.23858 0 2 2.23858 2 5C2 8.5 7 14 7 14C7 14 12 8.5 12 5C12 2.23858 9.79086 0 7 0ZM7 6.5C6.17157 6.5 5.5 5.82843 5.5 5C5.5 4.17157 6.17157 3.5 7 3.5C7.82843 3.5 8.5 4.17157 8.5 5C8.5 5.82843 7.82843 6.5 7 6.5Z" fill="currentColor"/></svg>
                    <span id="store-address-text"></span>
                  </span>
                </div>
                <div class="store-rating-row">
                  <span class="store-rating-num" id="store-rating-num"></span>
                  <svg class="store-rating-star" viewBox="0 0 12 12" fill="none"><path d="M6 1L7.5 4.5L11 5L8.5 7.5L9 11L6 9.5L3 11L3.5 7.5L1 5L4.5 4.5L6 1Z" fill="#F5A623"/></svg>
                  <span class="store-separator">•</span>
                  <span class="store-categories-text" id="store-categories-text"></span>
                </div>
                <p class="store-description" id="store-description"></p>
              </div>
            </div>

            <!-- Featured Items -->
            <div class="featured-section" id="featured-section" style="display:none;">
              <div class="section-header">
                <h2>Featured Items</h2>
              </div>
              <div class="featured-scroll" id="featured-scroll"></div>
            </div>

            <!-- Category Tabs -->
            <div class="store-tabs-wrap">
              <div class="store-tabs" id="store-tabs"></div>
            </div>

            <!-- Products List -->
            <div class="store-products" id="store-products"></div>
          </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav" data-od-id="bottom-nav">
          <button class="nav-item" data-tab="home" id="nav-home"></button>
          <button class="nav-item" data-tab="cart" id="nav-cart"><span class="cart-badge" id="cart-badge">0</span></button>
          <button class="nav-center" data-tab="customize" id="nav-customize"></button>
          <button class="nav-item" data-tab="thrift" id="nav-thrift"></button>
          <button class="nav-item" data-tab="account" id="nav-account"></button>
        </div>

        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
    <div class="toast" id="toast">Added to cart</div>
  </div>

  <script src="../../assets/shared-icons.js"></script>
  <script src="../../components/bottom-nav.js"></script>
  <script src="../../components/product-counter.js"></script>
  <script src="../../components/favorites.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../data/mock-data.js"></script>
  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sellio · Thrift</title>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <link rel="stylesheet" href="../../assets/components.css">
  <link rel="stylesheet" href="../../assets/shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <p class="caption">Sellio · <strong>Thrift</strong></p>
    <div class="device">
      <div class="island"></div>
      <div class="btn-rail left-1"></div>
      <div class="btn-rail left-2"></div>
      <div class="btn-rail left-3"></div>
      <div class="btn-rail right-1"></div>

      <div class="screen">
        <div id="statusbar-main"></div>

        <div class="appbar" data-od-id="appbar">
          <span class="appbar__title">Thrift</span>
        </div>

        <div class="search-wrap">
          <div class="search-bar" data-od-id="search-bar">
            <div class="input-wrap">
              <svg viewBox="0 0 24 24"><circle cx="11.5" cy="11.5" r="9.5" stroke="#1F1F1F" stroke-opacity="0.38" stroke-width="1.5" fill="none"/><path d="M20 20L22 22" stroke="#1F1F1F" stroke-opacity="0.66" stroke-width="1.5" stroke-linecap="round"/></svg>
              <input type="text" placeholder="Search your favorite items" readonly />
            </div>
            <button class="filter-btn" data-od-id="filter-btn"></button>
          </div>
        </div>

        <div class="category-tabs-wrap">
          <div class="category-tabs" id="category-tabs"></div>
        </div>

        <div class="products-scroll">
          <div class="products-grid" id="products-grid"></div>
        </div>

        <div class="bottom-nav" data-od-id="bottom-nav">
          <button class="nav-item" data-tab="home" id="nav-home"></button>
          <button class="nav-item" data-tab="cart" id="nav-cart"></button>
          <button class="nav-center" data-tab="customize" id="nav-customize"></button>
          <button class="nav-item active" data-tab="thrift" id="nav-thrift"></button>
          <button class="nav-item" data-tab="account" id="nav-account"></button>
        </div>
        <div class="home-indicator" aria-hidden></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Added to cart</div>

  <script src="../../assets/shared-icons.js"></script>
  <script src="../../components/bottom-nav.js"></script>
  <script src="../../components/toast.js"></script>
  <script src="../../components/product-counter.js"></script>
  <script src="../../components/favorites.js"></script>
  <script src="../../data/mock-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
